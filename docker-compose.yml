version: "2.4"
services:
  db:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: heatroute
      POSTGRES_USER: heatroute
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./deploy.sh to prepare .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    mem_limit: 3g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatroute -d heatroute"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimus-heatroute:2.1-final
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/heatroute
      DB_USER: heatroute
      DB_PASSWORD: ${DB_PASSWORD:?Run ./deploy.sh to prepare .env}
      OPTIMUS_STORAGE: /data
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx6g -XX:+ExitOnOutOfMemoryError -Dheatroute.entryPolicy=${ENTRY_POLICY:-cost}"
    volumes:
      - calculations:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    mem_limit: 8g
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
volumes:
  database:
  calculations:
